# Railway Infrastructure as Code — plan on PRs, apply on merge.
#
# One-time setup:
#   1. Railway → your project → Settings → API Tokens → create a PROJECT TOKEN
#      scoped to the production environment.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      new repository secret  RAILWAY_TOKEN = <that token>
#
# After that, every PR that touches .railway/** gets a plan comment, and
# merging it provisions the changes (service, volume, env, domains…).
# Code-only pushes deploy via the GitHub source defined in .railway/railway.ts.

name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install railway   # SDK that evaluates .railway/railway.ts
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install railway
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
