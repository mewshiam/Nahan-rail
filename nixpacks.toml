# Fallback build config for platforms that build with Nixpacks instead of
# the Dockerfile (Railway uses the Dockerfile when one is present; this file
# makes Nixpacks-based builders behave identically).
[phases.setup]
nixPkgs = ["...", "python3", "gcc", "g++", "make"]

[phases.install]
cmds = ["npm ci --omit=dev || npm install --omit=dev"]

[start]
cmd = "node railway/server.js"
